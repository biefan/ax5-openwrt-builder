name: Build OpenWrt for Redmi AX5 (RA67) with Wi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '*.sh'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-pip rsync unzip zlib1g-dev file wget subversion
          pip3 install --upgrade cmake ninja
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone Source Code
        run: |
          git clone --depth 1 https://github.com/kimocoder/qsdk_build.git openwrt
          cd openwrt
          # 移除失效与冲突的 feed，换成有效的 nss-packages 源
          sed -i '/kenzo/d; /small/d' feeds.conf.default
          sed -i '/nss_packages/d' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          cd openwrt
          cat << 'CONF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_redmi_ax5=y
          CONFIG_PACKAGE_ipq-wifi-redmi_ax5=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_zram-swap=y
          # 显式补全 ucode 基础依赖，防止 opkg 打包时版本找不到
          CONFIG_PACKAGE_ucode=y
          CONFIG_PACKAGE_libucode=y
          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-ubus=y
          CONFIG_PACKAGE_ucode-mod-uci=y
          # 禁用与 6.6 内核冲突的 vendor qca-nss-drv，使用原生 PPE flowtable
          CONFIG_PACKAGE_kmod-qca-nss-drv=n
          CONFIG_PACKAGE_kmod-qca-nss-ecm=n
          # 禁用前端模板字节码强转，避免宿主机工具链动态库链接问题
          CONFIG_LUCI_SRCDIET=n
          CONF
          # 修复上游 rpcd-mod-luci 误要求 CMake 3.31 导致的编译中断
          find feeds/ -name CMakeLists.txt -exec sed -i -E 's/cmake_minimum_required\(VERSION [0-9\.]+\)/cmake_minimum_required(VERSION 3.20)/g' {} + || true
          # 彻底禁用 LuCI 的 host 端 ucode 预编译，杜绝动态库缺失报错
          find feeds/luci/ -name "luci.mk" -exec sed -i "s/ifeq (\$(LUCI_MINIFY_UT),1)/ifeq (0,1)/g" {} + || true
          make defconfig

      - name: Download Package Dependencies
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the Firmware
        run: |
          cd openwrt
          # 确保 host 工具能找到本地编译的 libucode 等动态共享库
          sudo sh -c "echo \"$PWD/staging_dir/host/lib\" > /etc/ld.so.conf.d/openwrt-host.conf"
          sudo ldconfig || true
          export LD_LIBRARY_PATH="$PWD/staging_dir/host/lib:$PWD/staging_dir/host/lib64:$LD_LIBRARY_PATH"
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Organize Output Files
        id: organize
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        with:
          tag_name: Redmi_AX5_WiFi_${{ github.run_number }}
          name: Redmi AX5 (RA67) OpenWrt Firmware (Wi-Fi 6 Enabled)
          files: ${{ env.FIRMWARE_PATH }}/*redmi_ax5*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_Redmi_AX5_WiFi
          path: ${{ env.FIRMWARE_PATH }}/*redmi_ax5*
